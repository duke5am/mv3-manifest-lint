[project]
name = "mv3-manifest-lint"
version = "1.0.0"
description = "Static linter for Chrome Manifest V3 extensions: catches what gets an extension rejected from the Chrome Web Store or breaks it at runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "duke5am" }]
keywords = ["chrome-extension", "manifest-v3", "linter", "chrome-web-store"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
mv3-manifest-lint = "mv3_manifest_lint:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mv3_manifest_lint"]
